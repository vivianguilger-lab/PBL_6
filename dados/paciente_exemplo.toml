# =============================================================================
# Dados PRÉ-INDUÇÃO do paciente (o que está no monitor/prontuário antes da
# injeção) e o protocolo que se pretende usar.  Edite e rode:
#   julia --project=. scripts/02_prever_paciente.jl dados/paciente_exemplo.toml
# =============================================================================

[paciente]
nome   = "Paciente A - 62 anos, hipertensa controlada"
idade  = 62          # anos
sexo   = "F"         # "M" ou "F"
peso   = 72.0        # kg
altura = 160.0       # cm
pas    = 148.0       # mmHg (pressão sistólica pré-indução)
pad    = 82.0        # mmHg (pressão diastólica pré-indução)
fc     = 78.0        # bpm
# pam  = 104.0       # opcional: PAM medida (senão PAD + (PAS-PAD)/3)
# dc   = 4.8         # opcional: débito cardíaco medido em L/min (senão estimado)

[protocolo]
dose_mg_kg           = 1.5    # dose de indução que se pretende usar
duracao_bolus_s      = 20.0   # tempo de injeção do bolus
manutencao_ug_kg_min = 0.0    # infusão contínua após o bolus (TIVA); 0 = só bolus
limiar_pam           = 65.0   # limiar de hipotensão usado na janela de dose
alvo_bis             = 60.0   # hipnose adequada: BIS abaixo deste valor
